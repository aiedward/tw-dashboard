<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>台股操盤儀表板</title>
  <meta name="description" content="台股五面向（技術、籌碼、基本、消息、風險）評分與操盤儀表板">
  <meta name="theme-color" content="#0b0f17">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><img src="icons/icon.svg" alt="">台股操盤儀表板</div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="foot"></div>
  </aside>
  <main>
    <div class="top">
      <h1 id="title">大盤總覽</h1>
      <span class="pill" id="datapill"><span class="dot"></span><span>載入中…</span></span>
      <button class="iconbtn" id="themebtn" title="切換深淺色" aria-label="切換深淺色">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
    <div id="view"><div class="loading">載入中…</div></div>
  </main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<script type="module" src="js/app.js"></script>
</body>
</html>
